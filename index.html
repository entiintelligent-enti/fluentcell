<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101A25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FluentCell">
<title>FluentCell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tek sütun, alt sekme çubuğu. Test cihazı okuması gibi: şarj hücreleri (SoC), mono sayılar, düz köşeler. */
:root{
  --bg:#E8ECF0; --panel:#F6F8FA; --panel2:#D9E0E7; --ink:#101A25; --mute:#4A5B6E; --line:#C0C9D3;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DAE4FB;
  --ok:#0F7A4B; --warn:#A85F00; --bad:#BF3B2E;
  --f-disp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141C; --panel:#151F2A; --panel2:#213040; --ink:#E7EEF5; --mute:#9CB0C4; --line:#2A3A4B;
    --accent:#7FA3FF; --accent-ink:#0A1431; --accent-soft:#1B2B52;
    --ok:#3CC98B; --warn:#F0A93A; --bad:#F27D6F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141C; --panel:#151F2A; --panel2:#213040; --ink:#E7EEF5; --mute:#9CB0C4; --line:#2A3A4B;
  --accent:#7FA3FF; --accent-ink:#0A1431; --accent-soft:#1B2B52;
  --ok:#3CC98B; --warn:#F0A93A; --bad:#F27D6F; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body);
  padding-block:calc(14px + env(safe-area-inset-top, 0px)) 0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto; padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px))}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.lbl{font:500 11px/1.2 var(--f-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--mute)}

.top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-bottom:12px; border-bottom:2px solid var(--ink); margin-bottom:16px}
.brand{font:700 22px/1 var(--f-disp); letter-spacing:.01em}
.top .mono{font-size:12px; color:var(--mute)}

.card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:12px; min-width:0}
.card h2{font:700 22px/1.15 var(--f-disp); text-wrap:balance}
.card h2 + p{margin-top:6px}
.sub{color:var(--mute); font-size:15px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.between{justify-content:space-between}

.btn{border:1px solid var(--ink); background:transparent; border-radius:4px; padding:10px 14px; font-weight:600; min-height:44px}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.sm{padding:6px 12px; min-height:36px; font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.ghost{border-color:var(--line); color:var(--mute)}
.btn[disabled]{opacity:.45; cursor:default}

/* SoC */
.soc{display:flex; align-items:center; gap:0; margin-top:12px}
.cells{flex:1; display:grid; grid-template-columns:repeat(10,1fr); gap:3px; padding:4px; border:2px solid var(--ink); border-radius:4px}
.cells i{height:30px; background:var(--panel2); border-radius:1px}
.cells i.on{background:var(--soc)}
.nub{width:6px; height:18px; background:var(--ink); border-radius:0 3px 3px 0}
.read{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.big{font:700 44px/1 var(--f-mono); letter-spacing:-.02em}
.big small{font-size:20px; font-weight:500; color:var(--mute)}
.meta{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font:500 13px/1.3 var(--f-mono); color:var(--mute)}
.meta b{color:var(--ink)}

/* plan rows */
.blk{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0}
.blk h3{font:700 18px/1.2 var(--f-disp)}
.blk p{font-size:14px; color:var(--mute); margin-top:2px}
.blk-r{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.blk-r .mono{font-size:12px; color:var(--mute)}
.chk{width:32px; height:32px; border:2px solid var(--ink); background:transparent; border-radius:4px; display:grid; place-items:center; padding:0}
.is-done .chk{background:var(--ok); border-color:var(--ok); color:#fff}
.is-done h3{text-decoration:line-through; text-decoration-thickness:2px; color:var(--mute)}

.hist{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.hist div{display:flex; flex-direction:column; gap:5px; align-items:center; font:500 11px var(--f-mono); color:var(--mute)}
.hist i{display:block; width:100%; height:22px; background:var(--panel2); border-radius:2px}
.hist .part i{background:var(--accent); opacity:.55}
.hist .full i{background:var(--ok)}
.hist .now span{color:var(--ink); font-weight:700}

/* quote block for English starter */
.say{font:500 17px/1.45 var(--f-mono); background:var(--panel2); border-left:4px solid var(--accent); padding:12px 14px; border-radius:0 4px 4px 0; margin-top:10px; overflow-wrap:anywhere}

/* bar with timer */
.bar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; align-items:center; background:var(--accent-soft); border:1px solid var(--accent); border-radius:6px; padding:12px 14px; margin-bottom:12px}
.bar b{font:700 17px/1.2 var(--f-disp)}
.timer{font:700 30px/1 var(--f-mono); text-align:right}
.bar .row{grid-column:1 / -1}
.bar.done{background:transparent; border-color:var(--ok)}
.bar.done b{color:var(--ok)}

/* steps */
ol.steps{list-style:none; counter-reset:s; padding:0; margin:12px 0 0; display:flex; flex-direction:column; gap:10px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:28px minmax(0,1fr); gap:8px}
ol.steps li::before{content:counter(s); font:700 14px/26px var(--f-mono); width:26px; height:26px; text-align:center; border:1.5px solid var(--ink); border-radius:4px}

.seg{display:grid; grid-template-columns:1fr 1fr; border:1.5px solid var(--ink); border-radius:5px; overflow:hidden; margin-bottom:12px}
.seg button{border:0; background:transparent; padding:11px; font-weight:600; min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.res{display:flex; flex-direction:column; gap:0}
.res a.item{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit}
.res a.item:first-child{border-top:0}
.res b{font:700 17px/1.2 var(--f-disp); display:block}
.res span.w{font-size:14px; color:var(--mute)}
.res .go{color:var(--accent); font:600 13px var(--f-mono); white-space:nowrap}

/* flashcards */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px}
.stat .n{font:700 28px/1.1 var(--f-mono)}
.fc{min-height:230px; display:flex; flex-direction:column; justify-content:space-between; gap:16px}
.fc .front{font:700 26px/1.2 var(--f-disp); text-wrap:balance}
.fc .en{font:700 28px/1.2 var(--f-disp); color:var(--accent); text-wrap:balance; overflow-wrap:anywhere}
.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.rate button{border:1px solid var(--ink); background:transparent; border-radius:4px; padding:8px 2px; min-height:56px; font-weight:600; font-size:14px; display:flex; flex-direction:column; align-items:center; gap:2px}
.rate button small{font:500 11px var(--f-mono); color:var(--mute)}
.ico{display:inline-grid; place-items:center; width:40px; height:40px; border:1px solid var(--line); border-radius:4px; background:transparent}

input[type=text],input[type=password],textarea{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:4px; padding:10px 12px; min-height:44px}
textarea{resize:vertical; font:500 14px/1.45 var(--f-mono)}
label{display:block; font-size:13px; color:var(--mute); margin:10px 0 4px}
details{margin-top:4px}
summary{cursor:pointer; font-weight:600; padding:8px 0; min-height:44px; display:flex; align-items:center}
.list{margin:0; padding:0; list-style:none}
.list li{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:14px}
.list li span:first-child{min-width:0; overflow-wrap:anywhere}
.tag{font:500 11px var(--f-mono); color:var(--mute); white-space:nowrap}
.mist{padding:10px 0; border-top:1px solid var(--line)}
.mist .w{color:var(--bad); text-decoration:line-through; overflow-wrap:anywhere}
.mist .r{color:var(--ok); font-weight:600; overflow-wrap:anywhere}

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel); border-top:2px solid var(--ink);
  display:grid; grid-template-columns:repeat(4,1fr);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs button{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; min-height:52px; font:600 12px var(--f-body); color:var(--mute); border-radius:4px}
nav.tabs button[aria-current="page"]{color:var(--accent); background:var(--accent-soft)}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom, 0px)); z-index:30;
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:4px; font-size:14px; max-width:90vw;
}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font:500 12px var(--f-mono); color:var(--mute); margin-top:8px}
@media (prefers-reduced-motion: no-preference){ .cells i{transition:background .25s} }
/* --- yapay zeka --- */
.ai-tag{display:inline-flex; align-items:center; gap:6px; font:600 11px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:2px 6px}
.err{color:var(--bad); font-size:14px; margin-top:8px}
.out{margin-top:14px; border-top:2px solid var(--ink); padding-top:12px; display:flex; flex-direction:column; gap:10px}
.out h3{font:700 16px/1.2 var(--f-disp); text-transform:uppercase; letter-spacing:.03em}
.why{font-size:13px; color:var(--mute); margin-top:2px}
.ph{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line)}
.ph b{display:block; font-weight:600; overflow-wrap:anywhere}
.ph span{font-size:13px; color:var(--mute)}
.chat{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.msg{max-width:92%; padding:10px 12px; border-radius:6px; font-size:15px; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:1px}
.msg.bot{align-self:flex-start; background:var(--panel2); border-bottom-left-radius:1px}
.msg .fb{font-size:13px; color:var(--mute); margin-bottom:6px}
.msg .better{font:500 13px/1.4 var(--f-mono); color:var(--ok); margin-bottom:8px}
.msg .q{font-weight:600}
.spin{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
select{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:4px; padding:10px 12px; min-height:44px}
.gear{border:1px solid var(--line); background:transparent; border-radius:4px; width:38px; height:38px; display:grid; place-items:center; color:var(--ink)}
.top .rt{display:flex; align-items:center; gap:10px}
.ok-txt{color:var(--ok); font-size:14px; margin-top:8px}
</style>
</head>

 {title:'Tanışma ve anlamadığını söyleme',goal:'Kendini 1 dakikada tanıtabilmek ve anlamadığında "Could you repeat that?" diyebilmek.',

  prompts:{

function planFor(ds){
  var wd=parse(ds).getDay();
  var B={
   speak:{id:'speak',t:'Konuşma',m:15,tab:'konus',d:'Günün konusunu sesli anlat, kaydet, düzelt.'},
   tutor:{id:'speak',t:'Tutor dersi',m:30,tab:'konus',d:'italki veya Preply ile 30 dk sohbet. Gramer değil konuşma iste.'},
   prova:{id:'speak',t:'Toplantı provası',m:15,tab:'konus',d:'2 dakikalık sunumu kaydet ve dinle.'},
   shadow:{id:'shadow',t:'Shadowing',m:15,tab:'video',sub:'shadow',d:'Kısa bir videoyu cümle cümle taklit et.'},
   listen:{id:'listen',t:'Dinleme',m:15,tab:'video',sub:'listen',d:'İngilizce altyazılı video, 3-5 kalıp not al.'},
   cards:{id:'cards',t:'Kartlar',m:15,tab:'kartlar',d:'Aralıklı tekrar: bekleyen ve yeni kalıplar.'},
   review:{id:'review',t:'Haftayı değerlendir',m:10,tab:'konus',d:'Hata defterini gözden geçir, haftanın en zor anını konuş.'}
  };
  var L=function(m){var x=Object.assign({},B.listen);x.m=m;return x};
  var C=function(m){var x=Object.assign({},B.cards);x.m=m;return x};
  if(wd===0)return [L(20),C(10),B.review];
  if(wd===4)return [B.tutor,C(15),L(15)];

}

function counts(){var t=TODAY(),u=unlocked();var due=u.filter(function(c){return S.cards[c.id]&&S.cards[c.id].due<=t}).length;var fresh=u.filter(function(c){return !S.cards[c.id]}).length;var left=Math.max(0,NEWMAX-(S.intro[t]||0));return {due:due,fresh:Math.min(fresh,left),total:u.length,learned:u.filter(function(c){return S.cards[c.id]&&S.cards[c.id].int>=7}).length}}
function buildQueue(){
  var t=TODAY(),u=unlocked();
  var due=u.filter(function(c){return S.cards[c.id]&&S.cards[c.id].due<=t}).sort(function(a,b){return S.cards[a.id].due.localeCompare(S.cards[b.id].due)}).map(function(c){return c.id});
  var left=Math.max(0,NEWMAX-(S.intro[t]||0));
  var fresh=u.filter(function(c){return !S.cards[c.id]}).slice(0,left).map(function(c){return c.id});
  Qdate=t;return due.concat(fresh);
}
function cardById(id){return allCards().filter(function(c){return c.id===id})[0]}
function nextState(c,q){
  var ease=c.ease,it=c.int,reps=c.reps,lap=c.lapses,ni,ne=ease,nr=reps,nl=lap;
  if(q===0){ni=0;ne=Math.max(1.3,ease-.2);nr=0;nl=lap+1}
  else if(q===1){ni=Math.max(1,Math.round((it||1)*1.2));ne=Math.max(1.3,ease-.15);nr=reps+1}
  else if(q===2){ni=reps===0?1:(reps===1?3:Math.round(it*ease));nr=reps+1}
  else{ni=reps===0?3:(reps===1?6:Math.round(it*ease*1.3));ne=ease+.15;nr=reps+1}
  return {card:{ease:ne,int:ni,reps:nr,lapses:nl,due:addDays(TODAY(),ni)},ni:ni};
}
var FRESH={ease:2.5,int:0,reps:0,lapses:0,due:null};

}

var AIK='fluentcell-ai';
function aiCfg(){try{return JSON.parse(localStorage.getItem(AIK))||{}}catch(e){return {}}}

function aiReady(){return !!aiCfg().key}
var A={busy:{},err:{},ok:{},draft:{},fix:null,gen:null,dec:null,meet:{role:'mudur',msgs:[],sum:null},models:null};
var LEARNER='The learner is Engin, a Turkish battery test engineer working in R&D (testing battery packs, finding and fixing faulty cells, modules and BMS issues). His English level is B1. His goal is to understand and answer in work meetings and talk about his work. Use simple, natural, spoken workplace English (A2-B1 vocabulary). Write every Turkish explanation in short, plain Turkish.';
var ROLES={
  mudur:{n:'Müdür · haftalık durum',d:'Ar-Ge müdürün haftalık toplantıda ne test ettiğini, sorunları ve sonraki adımları soruyor.',sys:'You are his R&D manager in a weekly status meeting. Ask about his tests this week, problems, results, risks and next steps.'},
  tedarikci:{n:'Tedarikçi · hücre sorunu',d:'Hücre tedarikçisiyle kalite sorunu görüşmesi. Veri istiyor, itiraz ediyor.',sys:'You are a quality engineer from the cell supplier. He reported weak cells. You ask for data (voltage, capacity, internal resistance, temperature), push back politely, and discuss next steps.'},
  musteri:{n:'Müşteri · test sonucu',d:'Müşteri batarya paketinin test sonuçlarını ve teslim tarihini soruyor.',sys:'You are a customer engineer asking about the test results of a battery pack you will buy: whether it is within spec, what failed, when it will be ready.'},
  mulakat:{n:'İş görüşmesi',d:'Yabancı bir şirketle mülakat: deneyimin, projelerin, Formula Student.',sys:'You are interviewing him for a battery test engineer job at an international company. Ask about his experience, a problem he solved, his projects and why he wants the job.'}
};
function recentMistakes(){return S.mistakes.filter(function(x){return !x.ok}).slice(-5).map(function(x){return '"'+x.wrong+'" -> "'+x.right+'"'}).join('; ')}

function gemReq(path,opt){
  var c=aiCfg();
  if(!c.key)return Promise.reject(new Error('Önce Ayarlar\'dan Gemini API anahtarını gir.'));
  opt=opt||{};opt.headers=Object.assign({'x-goog-api-key':c.key},opt.headers||{});
  return fetch('https://generativelanguage.googleapis.com/v1beta/'+path,opt).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){
        var m=(j.error&&j.error.message)||('HTTP '+r.status);
        if(r.status===400&&/API key/i.test(m))m='API anahtarı geçersiz. Ayarlar\'dan kontrol et.';
        else if(r.status===403)m='Bu anahtarın Gemini API izni yok ya da kısıtlı. ('+m+')';
        else if(r.status===429)m='Kullanım limiti doldu. Biraz bekleyip tekrar dene.';
        else if(r.status===404)m='Model bulunamadı. Ayarlar\'dan "Modelleri yükle" ile yeni model seç.';
        throw new Error(m);
      }
      return j;
    });
  },function(){throw new Error('Gemini\'ye ulaşılamadı. İnternet bağlantını kontrol et.')});
}
function rankModel(n){var m=n.match(/gemini-(\d+(?:\.\d+)?)/);var v=m?parseFloat(m[1]):0;var pen=/preview|exp|latest/.test(n)?0.05:0;return v-pen}
function loadModels(){
  return gemReq('models?pageSize=200').then(function(j){
    var list=(j.models||[]).filter(function(m){
      var n=m.name||'';
      return (m.supportedGenerationMethods||[]).indexOf('generateContent')>-1&&/gemini/.test(n)&&!/embedding|image|tts|audio|live|vision|aqa|robotics|computer/.test(n);
    }).map(function(m){return m.name.replace('models/','')});
    list.sort(function(a,b){return rankModel(b)-rankModel(a)});
    return list;
  });
}
function pickDefault(list){
  var f=list.filter(function(n){return /flash/.test(n)&&!/lite/.test(n)&&!/preview|exp/.test(n)});
  if(!f.length)f=list.filter(function(n){return /flash/.test(n)});
  return f[0]||list[0];
}
function ensureModel(){
  var c=aiCfg();if(c.model)return Promise.resolve(c.model);
  return loadModels().then(function(l){var m=pickDefault(l);if(!m)throw new Error('Kullanılabilir Gemini modeli bulunamadı.');c=aiCfg();c.model=m;aiSetCfg(c);A.models=l;return m});
}
function gem(system,contents,json){
  return ensureModel().then(function(model){
    var body={systemInstruction:{parts:[{text:system}]},contents:contents,generationConfig:{temperature:json?0.4:0.8}};
    if(json)body.generationConfig.responseMimeType='application/json';
    return gemReq('models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }).then(function(j){
    var c=j.candidates&&j.candidates[0];
    if(!c||!c.content){var why=(j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason)||'boş cevap';throw new Error('Gemini cevap vermedi ('+why+'). Tekrar dene.')}
    var t=(c.content.parts||[]).filter(function(p){return !p.thought&&p.text}).map(function(p){return p.text}).join('');
    if(!json)return t;
    t=t.trim().replace(/^```(?:json)?\s*/i,'').replace(/```$/,'').trim();
    try{return JSON.parse(t)}catch(e){throw new Error('Cevap okunamadı. Tekrar dene.')}
  });
}
function user(t){return {role:'user',parts:[{text:t}]}}
function run(key,p,done){
  A.busy[key]=true;A.err[key]='';render();
  p.then(function(r){A.busy[key]=false;done(r);render()},function(e){A.busy[key]=false;A.err[key]=e.message||String(e);render()});
}

  '<section class="card"><div class="lbl">Yedek</div><h2 style="margin-top:6px">İlerlemen bu cihazda</h2><p class="sub">Kartlar, hata defteri ve günler bu tarayıcıda saklanır. Telefon değiştirmeden ya da tarayıcı verisini silmeden önce yedek al.</p><div class="row" style="margin-top:10px"><button class="btn" data-a="backup">Yedeği indir</button><label class="btn" style="margin:0;display:inline-flex;align-items:center;color:var(--ink);font-size:16px" for="restore">Yedekten yükle</label><input type="file" id="restore" accept="application/json,.json" hidden></div></section>'+
  '<section class="card"><div class="lbl">Sıfırla</div><p class="sub" style="margin-top:6px">Planı 1. günden başlatır, tüm kartları ve hata defterini siler.</p><div class="row" style="margin-top:10px"><button class="btn sm ghost" data-a="reset">Planı sıfırla</button></div></section>'+
  '<div class="foot"><span id="status">'+esc(status)+'</span><button class="btn sm ghost" data-a="tab" data-tab="today">Bugün\'e dön</button></div>';
}

/* --- tıklamalar --- */
function aiClick(a,b){
  if(a==='ai-fix'){doFix();return true}
  if(a==='ai-gen'){doGen();return true}
  if(a==='ai-dec'){doDec();return true}
  if(a==='ai-addcard'){
    var src=b.dataset.src,i=Number(b.dataset.i);
    var list=src==='fix'?(A.fix&&A.fix.phrases):src==='gen'?A.gen:(A.dec&&A.dec.phrases);
    var p=list&&list[i];if(p&&addCard(p.tr,p.en)){save();toast('Karta eklendi')}render();return true;
  }
  if(a==='ai-addall'){var n=0;(A.gen||[]).forEach(function(p){if(addCard(p.tr,p.en))n++});save();toast(n+' kart eklendi');render();return true}
  if(a==='ai-fix-mist'){var k=0;(A.fix&&A.fix.mistakes||[]).forEach(function(m){if(addMistake(m.wrong,m.right))k++});save();toast(k+' hata deftere eklendi');render();return true}
  if(a==='ai-meet-start'){
    var sel=document.getElementById('ai-role');if(sel)A.meet.role=sel.value;
    A.meet.msgs=[];A.meet.sum=null;
    run('meet',gem(meetSys(),meetContents(),true),meetPush);return true;
  }
  if(a==='ai-meet-send'){
    var t=(A.draft['ai-reply']||'').trim();if(!t){A.err.meet='Önce cevabını yaz.';render();return true}
    A.meet.msgs.push({role:'user',text:t});A.draft['ai-reply']='';
    run('meet',gem(meetSys(),meetContents(),true),meetPush);return true;
  }
  if(a==='ai-meet-end'){
    var sys=LEARNER+' Here is a practice meeting. Evaluate ONLY the learner\'s answers. Return ONLY JSON: {"summary_tr": 2-3 Turkish sentences: how he did and the one thing to work on, "mistakes": [up to 4 of his real mistakes, each {"wrong": what he said, "right": correction}]}.';
    var log=A.meet.msgs.map(function(m){return m.role==='user'?'LEARNER: '+m.text:'OTHER: '+m.q}).join('\n');
    run('meet',gem(sys,[user(log)],true),function(r){A.meet.sum=r});return true;
  }
  if(a==='ai-meet-mist'){var z=0;(A.meet.sum&&A.meet.sum.mistakes||[]).forEach(function(m){if(addMistake(m.wrong,m.right))z++});save();toast(z+' hata deftere eklendi');render();return true}
  if(a==='ai-meet-reset'){A.meet.msgs=[];A.meet.sum=null;A.err.meet='';render();return true}
  if(a==='ai-savekey'){
    var key=(A.draft['k-key']||'').trim();
    if(!key){A.err.key='Anahtarı yapıştır.';render();return true}
    var old=aiCfg();aiSetCfg({key:key});A.ok.key='';
    var p=loadModels().then(function(l){
      var m=pickDefault(l);if(!m)throw new Error('Bu anahtarla kullanılabilir Gemini modeli bulunamadı.');
      return {l:l,m:m};
    }).catch(function(e){aiSetCfg(old.key?old:{});throw e});
    run('key',p,function(r){aiSetCfg({key:key,model:r.m});A.models=r.l;A.draft['k-key']='';A.ok.key='Bağlandı. Model: '+r.m});
    return true;
  }
  if(a==='ai-delkey'){aiSetCfg({});A.models=null;A.ok.key='';toast('Anahtar silindi');render();return true}
  if(a==='ai-models'){run('models',loadModels(),function(l){A.models=l});return true}
  if(a==='backup'){
    try{
      var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      var url=URL.createObjectURL(blob),ln=document.createElement('a');
      ln.href=url;ln.download='fluentcell-yedek-'+TODAY()+'.json';document.body.appendChild(ln);ln.click();ln.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},2000);
    }catch(e){toast('Yedek indirilemedi')}
    return true;
  }
  return false;
}
document.addEventListener('input',function(e){
  var t=e.target;if(t&&t.hasAttribute&&t.hasAttribute('data-draft'))A.draft[t.id]=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='ai-role'){A.meet.role=t.value;render()}
  else if(t.id==='k-model'){var c=aiCfg();c.model=t.value;aiSetCfg(c);toast('Model: '+t.value);render()}
  else if(t.id==='restore'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!d.start||!d.cards)throw 0;S=norm(d);lsSave();Q=null;toast('Yedek yüklendi');render()}catch(err){toast('Bu dosya FluentCell yedeği değil')}};
    fr.readAsText(t.files[0]);
  }
});

function render(){
  var html=V.tab==='today'?vToday():V.tab==='kartlar'?vCards():V.tab==='video'?vVideo():V.tab==='ayarlar'?vSettings():vKonus();
  $('#app').innerHTML=html;
  $('#nav').innerHTML=TABS.map(function(t){var k=t[0]==='today'?'today':t[0];return '<button data-a="tab" data-tab="'+t[0]+'" '+(V.tab===t[0]?'aria-current="page"':'')+'>'+IC[k==='konus'?'konus':k]+'<span>'+t[1]+'</span></button>'}).join('');
}

var toastT=null;
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600)}
function go(tab,sub){V.tab=tab;if(sub)V.sub=sub;try{history.replaceState(null,'','#'+tab)}catch(e){}render();window.scrollTo(0,0)}
function toggle(id){var ds=TODAY();var d=S.done[ds]||[];var i=d.indexOf(id);if(i>-1)d.splice(i,1);else{d.push(id);if(T&&T.id===id)T=null}S.done[ds]=d;save();render()}

var resetArmed=false;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id;
  if(aiClick(a,b))return;
  if(a==='tab'){if(b.dataset.finish){var ds=TODAY(),d=S.done[ds]||[];if(d.indexOf(b.dataset.finish)<0){d.push(b.dataset.finish);S.done[ds]=d;save()}}go(b.dataset.tab)}
  else if(a==='sub'){V.sub=b.dataset.sub;render()}
  else if(a==='toggle'){toggle(id)}
  else if(a==='start'){var done=doneOf(TODAY()).indexOf(id)>-1;if(!done)T={id:id,end:Date.now()+Number(b.dataset.m)*60000};go(b.dataset.tab,b.dataset.sub||undefined)}
  else if(a==='timer'){if(T&&T.id===id)T=null;else T={id:id,end:Date.now()+Number(b.dataset.m)*60000};render()}
  else if(a==='reveal'){showAns=true;render()}
  else if(a==='rate'){rate(Number(b.dataset.q));render()}
  else if(a==='requeue'){Q=buildQueue();showAns=false;render()}
  else if(a==='speak'){say(b.dataset.text)}
  else if(a==='addcard'){
    var tr=$('#c-tr').value.trim(),en=$('#c-en').value.trim();
    if(!tr||!en){toast('İki alanı da doldur');return}
    S.custom.push({id:'c'+Date.now(),tr:tr,en:en});Q=null;save();render();toast('Kart eklendi')
  }
  else if(a==='copy'){
    var ta=document.getElementById(b.dataset.target);
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('Kopyalandı')}).catch(function(){ta.focus();ta.select();toast('Seçildi. Şimdi kopyala')})}
    catch(err){ta.focus();ta.select();toast('Seçildi. Şimdi kopyala')}
  }
  else if(a==='addm'){
    var w=$('#m-w').value.trim(),r=$('#m-r').value.trim();
    if(!w||!r){toast('İki alanı da doldur');return}
    S.mistakes.push({id:'m'+Date.now(),wrong:w,right:r,ok:false});save();render()
  }
  else if(a==='mok'){S.mistakes.forEach(function(x){if(x.id===id)x.ok=true});save();render()}
  else if(a==='mdel'){S.mistakes=S.mistakes.filter(function(x){return x.id!==id});save();render()}
  else if(a==='mtocard'){
    var m=S.mistakes.filter(function(x){return x.id===id})[0];if(!m)return;
    S.custom.push({id:'c'+Date.now(),tr:'Hata düzeltme. Yanlış: "'+m.wrong+'"',en:m.right});Q=null;save();toast('Karta çevrildi');render()
  }
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Emin misin? Tekrar dokun';setTimeout(function(){resetArmed=false;if(b.isConnected)b.textContent='Planı sıfırla'},4000);return}
    resetArmed=false;S=blank();Q=null;T=null;save();render();toast('Plan sıfırlandı')
  }
});

var h=(location.hash||'').replace('#','');
if(['today','kartlar','video','konus','ayarlar'].indexOf(h)>-1)V.tab=h;
window.addEventListener('hashchange',function(){var x=(location.hash||'').replace('#','');if(['today','kartlar','video','konus','ayarlar'].indexOf(x)>-1&&x!==V.tab){V.tab=x;render()}});
render();
})();
</script>
